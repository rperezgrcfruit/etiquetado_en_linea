<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imprimir con Zebra</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../BrowserPrint-3.1.250.min.js"></script>
</head>
<body>

<button id="printButton">Imprimir Mensaje</button>

<script>
$(document).ready(function() {
    $('#printButton').click(function() {
        // Comandos ZPL para imprimir el mensaje
        var zpl = "^XA^FO50,50^A0N,50,50^FDHello Zebra!^FS^XZ";  // Modifica este ZPL según sea necesario
        
        // Enviar a la impresora
        BrowserPrint.getDefaultDevice("printer", function(printer) {
            printer.send(zpl, function(response) {
                console.log("Comandos enviados a la impresora.");
            }, function(error) {
                console.error("Error al enviar a la impresora:", error);
            });
        }, function(error) {
            console.error("Error al obtener la impresora:", error);
        });
    });
});
</script>

</body>
</html>
